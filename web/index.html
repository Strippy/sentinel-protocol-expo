<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  <title>Sentinel Protocol</title>
  <meta name="theme-color" content="#040508" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sentinel" />
  <meta name="description" content="Zero-log DNS filter. Block trackers. Earn yield." />
  <style id="expo-reset">
    html, body { height: 100%; margin: 0; padding: 0; background: #040508; }
    body { overflow: hidden; }
    #root { display: flex; height: 100%; flex: 1; }
  </style>
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.ico" />
</head>
<body>
  <noscript>You need to enable JavaScript to run Sentinel Protocol.</noscript>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then(function (reg) { window.__sentinelSW = reg; })
          .catch(function (e) { console.warn('[Sentinel SW]', e.message); });
      });
    }
  </script>
</body>
</html>
